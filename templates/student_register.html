<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Governmrnt High School Gujra </title>
    <link rel="stylesheet" href="static/style.css" >
</head>
<body>
<div class="header">
      <h1> Government High School Gujra</h1>
      <h2> vikas khand and District- Dhamtari, Chhattisgarh</h2>
      </div>
<div class="container">

    <h2> student registration</h2>
    <form method="POST">
        <label >Username</label>
        <input type="text" name="student_name" id="student_name" placeholder="Enter student name" required><br>
        <label >father name</label>
        <input type="text" name="father_name" id="father_name" placeholder="Enter father name" required><br>
        <label >Mother name</label>
        <input type="text" name="mother_name" id="mother_name" placeholder="Enter mother name" required><br>
        <label >Date of Birth</label><
        <input type="date" name="date_of_birth" id="date_of_birth" required ><br>
        <label >Gender</label>
        <select name="gender">
            <option value="male" name="gender"> male    </option>
             <option value="female" name="gender"> female    </option><br>
        </select>
        <label >class</label>
        <select name="class_name">
            <option value="9"> class 9th   </option>
            <option value="10"> class 10th    </option><br>
        </select><br>
        <LABEL> MoBILE NUMBER</LABEL>
        <INPUT TYPE="text" name="mobile_number" id="mobile_number" placeholder="Enter mobile number" required  >
            <br>
        <label> Address</label>
        <input type="textarea" name="address" id="address" placeholder="Enter address" required>
        <br>
        <button type="submit">submit</button>
        <button type="reset">reset</button>




    </form>
</div>

</body>
</html>
